name: CI

on:
  push:
    branches: [main]
    paths:
      - 'phone-app/**'
  pull_request:
    paths:
      - 'phone-app/**'

defaults:
  run:
    working-directory: phone-app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: phone-app/package-lock.json
      - run: npm ci
      - run: npm run ci
