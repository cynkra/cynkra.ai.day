services:
  postgres:
    image: postgres:16-alpine
    container_name: devnest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devnest
      POSTGRES_PASSWORD: devnest
      POSTGRES_DB: devnest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devnest -d devnest"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: devnest-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

volumes:
  postgres_data:
